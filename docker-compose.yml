services:
  postgres:
    image: postgres:16-alpine
    container_name: limitless-search-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=limitless_search
      - POSTGRES_USER=limitless
      - POSTGRES_PASSWORD=limitless
    volumes:
      - limitless-search-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limitless -d limitless_search"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - limitless-network

  limitless-search:
    build:
      context: .
      dockerfile: Dockerfile
    image: limitless-search:local
    container_name: limitless-search
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3200:3200"
    expose:
      - "8888" # 后端监听端口，不开放到主机公网，只在容器内部/同网络内访问
    environment:
      # 后端监听端口
      - PORT=8888
      # 前端监听端口
      - WEB_PORT=3200
      - DATABASE_URL=postgres://limitless:limitless@postgres:5432/limitless_search?sslmode=disable
      - NEXT_PUBLIC_API_BASE=http://127.0.0.1:8888
    volumes:
      - limitless-search:/app/cache
      - limitless-search-web-data:/app/data
    networks:
      limitless-network:
        aliases:
          - backend
          - web
          - limitless-search
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  limitless-search-postgres:
    name: limitless-search-postgres
  limitless-search:
    name: limitless-search
  limitless-search-web-data:
    name: limitless-search-web-data

networks:
  limitless-network:
    name: limitless-network
