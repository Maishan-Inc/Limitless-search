name: Quality Checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/limitless_search
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/limitless_search/go.mod
          cache-dependency-path: backend/limitless_search/go.sum

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/limitless_search_web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/limitless_search_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm exec tsc -- --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: limitless-search:ci

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for healthy services
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 180))
          services=("postgres" "limitless-search")

          while [ "$SECONDS" -lt "$deadline" ]; do
            docker compose ps

            all_healthy=true
            for service in "${services[@]}"; do
              container_id="$(docker compose ps -q "$service" || true)"
              if [ -z "$container_id" ]; then
                all_healthy=false
                break
              fi

              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              echo "${service}: state=${state}, health=${health}"

              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                exit 1
              fi

              if [ "$health" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "$all_healthy" = true ]; then
              exit 0
            fi

            sleep 5
          done

          docker compose ps
          exit 1

      - name: Verify install page
        run: curl --fail --silent --show-error --location http://localhost:3200/install > /dev/null

      - name: Verify install status API
        run: |
          set -euo pipefail
          status_code="$(curl --silent --show-error --output /tmp/install-status.json --write-out "%{http_code}" http://localhost:3200/api/install/status)"
          test "$status_code" = "200"

      - name: Verify home route responds
        run: |
          set -euo pipefail
          status_code="$(curl --silent --show-error --output /tmp/home-response.html --write-out "%{http_code}" http://localhost:3200/)"
          case "$status_code" in
            200|301|302|303|307|308)
              exit 0
              ;;
            *)
              echo "Unexpected home route status: ${status_code}"
              exit 1
              ;;
          esac

      - name: Dump Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
