name: Build and Push Docker Image

# 触发条件：当推送到 main 分支或创建标签时执行
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]  # 匹配类似 v1.0.0 的标签

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/limitless_search
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/limitless_search/go.mod
          cache-dependency-path: backend/limitless_search/go.sum

      - name: Run Go tests
        run: go test ./...

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/limitless_search_web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/limitless_search_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm exec tsc -- --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境
    steps:
      # 步骤 1：拉取 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 步骤 2：设置 Docker 构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 步骤 3：登录 Docker Hub（只有版本标签发布时才需要推送权限）
      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 步骤 4：提取镜像标签（支持分支和标签触发）
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/limitless-search  # 替换为你的 Docker Hub 仓库名
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 步骤 5：main 分支只验证构建，版本标签才推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .  # Dockerfile 所在目录（当前目录）
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}  # 版本标签发布时推送镜像到 Docker Hub
          tags: ${{ steps.meta.outputs.tags }}  # 使用步骤 4 生成的标签
          labels: ${{ steps.meta.outputs.labels }}  # 附加元数据标签
